name: Research up to 500 speech-dialogue datasets
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/research-datasets.yml'

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lightweight research dependencies
        run: python -m pip install 'huggingface_hub>=0.32,<2'
      - name: Search Hugging Face and validate repository metadata
        run: |
          python src/research_500.py --target 500 --per-query 160 --max-queries 50 --max-verify 1500 --workers 5
      - name: Upload research CSV and JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dataset-research-500
          path: |
            data/researched_datasets_500.csv
            data/researched_datasets_500.json
            data/researched_datasets_500_errors.json
          if-no-files-found: warn
      - name: Commit verified HF metadata results
        run: |
          if [ -f data/researched_datasets_500.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/researched_datasets_500.json data/researched_datasets_500.csv data/researched_datasets_500_errors.json
            if ! git diff --cached --quiet; then
              git commit -m "data: refresh discovered HF dialogue corpus candidates"
              git push
            fi
          fi
